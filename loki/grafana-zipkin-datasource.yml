# Auto-provisioning źródła danych Zipkin w Grafanie (traces).
# Dzięki temu ślady można oglądać także w Grafanie (obok metryk i logów),
# a nie tylko w natywnym UI Zipkina (http://localhost:9411).
apiVersion: 1

datasources:
  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: true

# Promtail — zbiera logi WSZYSTKICH kontenerów Dockera (przez socket) i wysyła do Loki.
# Etykietuje strumienie nazwą kontenera, żeby w Grafanie filtrować per usługa
# (np. {container="photoFinder-app"}).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # zamontowane na wolumenie (docker-compose.yml), żeby przetrwało restart
  # kontenera — inaczej promtail po każdym restarcie czyta logi od zera
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # /photoFinder-app -> photoFinder-app
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # dashboard "Logs / App" filtruje po etykiecie job (label_values(job))
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: job
      # stdout / stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

  # Aplikacja odpalona lokalnie z IDE (profil dev) nie jest kontenerem,
  # więc docker_sd_configs jej nie widzi. Loguje do pliku
  # (logging.file.name w application-dev.properties), a tutaj tailujemy
  # ten plik, zamontowany w promtail pod /var/log/photofinder-local (patrz docker-compose.yml).
  - job_name: photofinder-app-local
    static_configs:
      - targets: ['localhost']
        labels:
          job: photofinder-app-local
          container: photoFinder-app-local
          stream: stdout
          __path__: /var/log/photofinder-local/*.log

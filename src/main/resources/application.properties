spring.application.name=photoFinder
server.port=8081
logging.level.eu.mm.software.photofinder.common.ExifExtractor=DEBUG

# Identyfikacja węzła przetwarzającego (widoczna w audit); puste = hostname auto-detect
worker.node.name=${WORKER_NODE_NAME:}

# Katalogi bazowe, w obrębie których wolno listować/odczytywać pliki (CSV). Każda ścieżka
# spoza tych katalogów (np. /etc, cudzy katalog domowy) jest odrzucana z 403 — patrz
# PathAccessGuard oraz plans/deep-analysis.md (etap 9.2, path traversal). Puste = brak dostępu.
photofinder.security.allowed-root-dirs=${ALLOWED_ROOT_DIRS:/media/nas/foto}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

#mongo
spring.data.mongodb.username=${MONGO_USERNAME:root}
spring.data.mongodb.database=${MONGO_DATABASE:admin}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.host=${MONGO_HOST:mongodb}
spring.data.mongodb.port=${MONGO_PORT:27017}

#rabbit
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

spring.ai.ollama.embedding.model=qwen3-embedding:0.6b

#env
nvidia.api.url=https://integrate.api.nvidia.com/
groq.api.url=https://api.groq.com/openai
mistral.base-url=https://api.mistral.ai/
together.api-url=https://api.together.xyz
hyperbolic.base-url=https://api.hyperbolic.xyz
google.api.url=https://generativelanguage.googleapis.com
cerebras.api.url=https://api.cerebras.ai/
cohere.api.url=https://api.cohere.com/
open.router.api.url=https://openrouter.ai/api/
cloud.flare.api.url=https://gateway.ai.cloudflare.com
cloudflare.user.id=${CLOUD_FLARE_USER_ID:XXX}
anthropic.api.url=https://api.anthropic.com

spring.ai.retry.on-client-errors=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.collection-name=Photos202606
spring.ai.model.embedding=ollama

spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
nvidia.api.key=${NVIDIA_API_KEY}
groq.api.key=${GROQ_API_KEY}
together.api.key=${TOGETHER_API_KEY}
hyperbolic.api.key=${HYPERBOLIC_API_KEY}
google.api.key=${GOOGLE_API_KEY}
cerebras.api.key=${CEREBRAS_API_KEY}
cohere.api.key=${COHERE_API_KEY}
openrouter.api.key=${OPENROUTER_API_KEY}
cloudflare.api.key=${CLOUDFLARE_API_KEY}

# Generuj silny klucz: openssl rand -base64 64
jwt.secret.key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:864000000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:6048000000}

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.mode=HTML

logging.level.root=INFO

spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.ai.vectorstore.chroma.document-splitter.token.max-tokens=512
spring.ai.vectorstore.chroma.document-splitter.token.overlap-tokens=50

ollama.model.name=llava:13b
anthropic.model.name=claude-sonnet-4-6
cerebras.model.name=gpt-oss-120b
cohere.model.name=c4ai-aya-vision-32b
gemini.model.name=gemini-2.0-flash
groq.model.name=meta-llama/llama-4-scout-17b-16e-instruct
cloudflare.model.name=@cf/llava-hf/llava-1.5-7b-hf
hyperbolic.model.name=deepseek-ai/DeepSeek-V3-0324
mistral.model.name=mistral-medium-3-5
nvidia.model.name=microsoft/phi-4-multimodal-instruct
openai.model.name=gpt-4o-mini
together.model.name=google/gemma-3n-E4B-it
openrouter.model.name=google/gemini-2.0-flash-001

minio.endpoint=http://${MINIO_HOST:localhost}:9000
minio.access-key=${MINIO_USER:minioadmin}
minio.secret-key=${MINIO_PASSWORD:miniopassword}
minio.bucket.tmp=photos-tmp

spring.data.mongodb.auto-index-creation=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://192.168.0.35:9411/api/v2/spans

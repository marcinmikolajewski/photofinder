plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.4.1'
}

group = 'com.mm.software'
version = '0.1.0-SNAPSHOT'

springBoot {
    buildInfo()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Spring Snapshots"
        url = uri("https://repo.spring.io/snapshot")
    }
}

ext {
    set('springAiVersion', "1.1.8")
    set('jjwtVersion', "0.12.6")
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Spring AI
    implementation 'org.springframework.ai:spring-ai-starter-model-mistral-ai'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'
    implementation 'io.grpc:grpc-netty-shaded:1.76.0'

    // AI providers — przypięta wersja (nie '+', który psuje reprodukowalność i audyt)
    implementation 'com.cohere:cohere-java:1.10.1'

    // Metrics — tylko Prometheus, bez Influx
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Tracing — Micrometer + eksport do Zipkina (wersje z BOM Spring Boot)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    // JWT — jedna wersja
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"

    // Storage
    implementation 'io.minio:minio:8.6.0'

    // Commons
    implementation 'commons-io:commons-io:2.17.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.apache.commons:commons-text:1.11.0'
    implementation("org.apache.commons:commons-imaging:1.0.0-alpha6")
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'
    implementation 'com.google.guava:guava:33.0.0-jre'

    // Retry
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // HTTP
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // API docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok'

    // Runtime
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
    dependencies {
        // io.minio:minio:8.6.0 ciągnie bcprov-jdk18on:1.81 (GHSA-574f-3g2m-x479, CVSS 9.3 —
        // powtórzenie keystreamu CTR po 255 blokach). Ani Boot BOM, ani spring-ai-bom go nie
        // zarządzają, więc wymuszamy wersję z backportowaną poprawką jawnie.
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
    }
}

tasks.named('bootWar') {
    archiveFileName = 'app.war'
}

tasks.named('test') {
    useJUnitPlatform()
}

// SBOM (CycloneDX) do skanowania podatności w Dependency-Track. `cyclonedxBom` generuje
// build/reports/cyclonedx/bom.json; `uploadBomToDependencyTrack` go tam wysyła.
cyclonedxBom {
    schemaVersion = "VERSION_16"
    projectType = "application"
    includeLicenseText = false
    includeBuildSystem = true
}

tasks.register('uploadBomToDependencyTrack', Exec) {
    dependsOn tasks.named('cyclonedxBom')
    group = 'verification'
    description = 'Wysyła wygenerowany SBOM (CycloneDX) do Dependency-Track (domyślnie lokalny ' +
            'dtrack-apiserver z ~/docker/llama.yaml). Wymaga zmiennej DEPENDENCY_TRACK_API_KEY; ' +
            'DEPENDENCY_TRACK_URL można nadpisać, gdy Dependency-Track jest gdzie indziej.'

    doFirst {
        String url = System.getenv('DEPENDENCY_TRACK_URL') ?: 'http://localhost:8083'
        String apiKey = System.getenv('DEPENDENCY_TRACK_API_KEY')
        if (!apiKey) {
            throw new GradleException(
                    'Brak DEPENDENCY_TRACK_API_KEY w zmiennych środowiskowych (klucz z Dependency-Track: ' +
                    'Administration > Access Management > Teams > API Keys).')
        }
        File bomFile = layout.buildDirectory.file('reports/cyclonedx/bom.json').get().asFile
        commandLine 'curl', '--fail-with-body', '-sS',
                "${url}/api/v1/bom",
                '-H', "X-Api-Key: ${apiKey}",
                '-F', 'autoCreate=true',
                '-F', "projectName=${project.name}",
                '-F', "projectVersion=${project.version}",
                '-F', "bom=@${bomFile}"
    }
}
spring.application.name=ollama-worker
spring.main.web-application-type=none

# === KONFIGURACJA DO EDYCJI NA KAŻDYM KOMPUTERZE ===

# Identyfikacja węzła - np. "PC-Salon", "PC-Sypialnia"
# Puste = auto-detect z hostname + /proc/cpuinfo
worker.node.name=LAPTOP_3e

# Model Ollama (musi być pobrany: ollama pull llava:13b)
ollama.model.name=llava:13b

# RabbitMQ - adres głównego komputera z photofinder
spring.rabbitmq.host=192.168.0.35
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# MinIO - adres głównego komputera z photofinder
minio.endpoint=http://192.168.0.35:9000
minio.access-key=${MINIO_USER:minioadmin}
minio.secret-key=${MINIO_PASSWORD:miniopassword}
minio.bucket.tmp=photos-tmp

# === ZAZWYCZAJ BEZ ZMIAN ===

# Ollama - lokalny na tym komputerze
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.enabled=false

# web-application-type=none wyłącza główny serwer HTTP (worker to tylko
# konsument RabbitMQ), więc actuator dostaje własny, osobny port —
# Prometheus scrapuje go przez job "ollama-worker" (patrz prometheus.yml
# na głównym komputerze + prometheus-targets/ollama-workers.yml).
management.server.port=8091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.node=${worker.node.name:unknown}

spring.docker.compose.enabled=false
logging.level.root=INFO
logging.level.eu.mm.software.photofinder=DEBUG

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

version: "3.7"

networks:
  photos-network:
    driver: bridge
  db-net:
    driver: bridge
  mq-net:
    driver: bridge

services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    restart: on-failure
    ports:
      - "15672:15672"
      - "15692:15692"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mq-net

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: on-failure
    user: "1000:1000"
    ports:
      - "27017:27017"
    volumes:
      - ~/docker/photos_finder/data/mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-example}
      - MONGO_INITDB_DATABASE=photos
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/photos -u root -p $${MONGO_PASSWORD:-example} --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - db-net

  mongodb-exporter:
    container_name: mongo-exporter
    image: percona/mongodb_exporter:0.42.0
    ports:
      - "9216:9216"
    command: "--collect-all"
    environment:
      - MONGODB_URI=mongodb://root:example@mongodb:27017/admin
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - photos-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - ":6333"  # REST API + Web UI
      - "6334:6334"  # GRPC
    volumes:
      - ~/docker/photos_finder/data/qdrant:/qdrant/storage
    networks:
      - photos-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: on-failure
    user: "1000:1000"
    depends_on:
      - mongodb-exporter
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-targets:/etc/prometheus/targets:ro
      - ~/docker/photos_finder/data/prometheus:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photos-network

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - photos-network
    pid: host
    command:
      - --path.rootfs=/host

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: on-failure
    user: "root"
    ports:
      - "3050:3000"
    volumes:
      - ~/docker/photos_finder/data/grafana:/var/lib/grafana
      - ./loki/grafana-loki-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./loki/grafana-zipkin-datasource.yml:/etc/grafana/provisioning/datasources/zipkin.yml:ro
      - ./grafana/alerting-rules.yml:/etc/grafana/provisioning/alerting/rules.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=example
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/login" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    networks:
      - photos-network

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: on-failure
    user: "1000:1000"
    ports:
      - "3100:3100"
    volumes:
      - ~/docker/photos_finder/data/loki:/loki
    networks:
      - photos-network

  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail
    restart: on-failure
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/docker/photos_finder/logs:/var/log/photofinder-local:ro
      - ~/docker/photos_finder/promtail:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - photos-network

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    restart: on-failure
    ports:
      - "9411:9411"
    networks:
      - photos-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    ports:
      - "11434:11434"
    tty: true
    restart: on-failure
    volumes:
      - ~/docker/ollama/data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_DEBUG=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - photos-network

  nvidia-dcgm-exporter:
    image: nvidia/dcgm-exporter
    container_name: nvidia-dcgm-exporter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    ports:
      - "9400:9400"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    networks:
      - photos-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: on-failure
    networks:
      - photos-network

  app:
    build: .
    container_name: photoFinder-app
    volumes:
      - '/media/nas/foto:/media/nas/foto'
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_PASSWORD: ${MONGO_PASSWORD:-example}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?ustaw JWT_SECRET_KEY w .env (patrz README)}
      MINIO_HOST: minio
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      HYPERBOLIC_API_KEY: ${HYPERBOLIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY}
      CLOUD_FLARE_API_KEY: ${CLOUD_FLARE_API_KEY}
      CLOUD_FLARE_USER_ID: ${CLOUD_FLARE_USER_ID}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - photos-network
      - db-net
      - mq-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - prod

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-miniopassword}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ~/docker/photos_finder/data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - photos-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
